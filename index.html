<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instrument Zoo</title>
  <meta name="description" content="Explore musical instruments in 3D: rotate, zoom and learn the anatomy of each part." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎻</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="16" r="15" fill="currentColor" opacity=".14"/><path d="M12 22.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V8l12-3v13.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V9.2L13.2 11.5V22.5z" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">Instrument <em>Zoo</em></span>
      </a>
      <nav class="tabs" id="instrument-tabs" role="tablist" aria-label="Instruments"></nav>
    </header>

    <main class="stage" id="stage">
      <div class="viewer" id="viewer"></div>
      <div class="pin-label" id="pin-label" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>

      <div class="toolbar" role="toolbar" aria-label="View controls">
        <button type="button" id="btn-reset" title="Back to the whole instrument (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></svg>
          <span>Overview</span>
        </button>
        <button type="button" id="btn-isolate" aria-pressed="false" disabled title="Fade everything except the selected part (I)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M3 12s3.5-6.5 9-6.5S21 12 21 12s-3.5 6.5-9 6.5S3 12 3 12z" /></svg>
          <span>Isolate</span>
        </button>
        <button type="button" id="btn-rotate" aria-pressed="false" title="Slowly spin the instrument">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.9 4M4 12a8 8 0 0 1 14.9-4M19 4v4h-4M5 20v-4h4" /></svg>
          <span>Spin</span>
        </button>
      </div>
      <p class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan · Click any part</p>
      <div class="loading" id="loading">Opening the gates…</div>
    </main>

    <aside class="sidebar" aria-label="Instrument anatomy">
      <section class="intro">
        <p class="family" id="inst-family"></p>
        <h1 id="inst-name"></h1>
        <p class="blurb" id="inst-blurb"></p>
      </section>
      <div class="anatomy-head">
        <h2>Anatomy</h2>
        <span class="count" id="part-count"></span>
      </div>
      <ol class="parts" id="parts"></ol>
      <p class="keys-hint"><kbd>↑</kbd><kbd>↓</kbd> step through parts · <kbd>Esc</kbd> overview</p>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
