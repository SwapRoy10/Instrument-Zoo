<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Instrument Zoo</title>
  <meta name="description" content="Explore every instrument of the orchestra and wind ensemble in 3D: rotate, zoom and learn the anatomy of each part." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ff7a45'/><path d='M12 22.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V8l12-3v13.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V9.2L13.2 11.5V22.5z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app" id="app" data-section="strings">
    <div class="backdrop" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span></div>

    <main class="stage" id="stage">
      <div class="viewer" id="viewer"></div>
      <div class="pin-label" id="pin-label" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>
    </main>

    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="M12 22.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V8l12-3v13.5a3.5 3.5 0 1 1-3.5-3.5c.9 0 1.7.3 2.3.9V9.2L13.2 11.5V22.5z" fill="#fff"/></svg>
        </span>
        <span class="brand-name">Instrument Zoo</span>
      </a>
      <button type="button" class="browse-toggle" id="browse-toggle" aria-expanded="false" aria-controls="browser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>All instruments</span>
      </button>
    </header>

    <aside class="browser glass" id="browser" aria-label="Instrument browser">
      <div class="browser-head">
        <div class="seg" id="ensemble-filter" role="radiogroup" aria-label="Ensemble"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search instruments" autocomplete="off" />
          <kbd>/</kbd>
        </label>
      </div>
      <nav class="browser-list" id="browser-list"></nav>
    </aside>

    <aside class="panel glass" id="panel" aria-label="Instrument details">
      <div class="panel-grip" aria-hidden="true"></div>
      <div class="panel-scroll">
        <div class="inst-head">
          <p class="eyebrow"><span class="dot"></span><span id="inst-section"></span></p>
          <h1 id="inst-name"></h1>
          <div class="badges" id="inst-badges"></div>
        </div>
        <dl class="stats">
          <div><dt>Range</dt><dd id="inst-range"></dd></div>
          <div><dt>Size</dt><dd id="inst-size"></dd></div>
        </dl>
        <p class="blurb" id="inst-blurb"></p>
        <div class="anatomy-head">
          <h2>Anatomy</h2>
          <span class="count" id="part-count"></span>
        </div>
        <ol class="parts" id="parts"></ol>
        <p class="keys-hint"><kbd>↑</kbd><kbd>↓</kbd> parts · <kbd>←</kbd><kbd>→</kbd> instruments · <kbd>Esc</kbd> overview</p>
      </div>
      <div class="panel-foot">
        <button type="button" class="nav-btn" id="prev-inst"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span></span></button>
        <button type="button" class="nav-btn next" id="next-inst"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </aside>

    <div class="toolbar glass" role="toolbar" aria-label="View controls">
      <button type="button" id="btn-reset" title="Back to the whole instrument (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" /></svg><span>Overview</span>
      </button>
      <button type="button" id="btn-isolate" aria-pressed="false" disabled title="Fade everything except the selected part (I)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M3 12s3.5-6.5 9-6.5S21 12 21 12s-3.5 6.5-9 6.5S3 12 3 12z" /></svg><span>Isolate</span>
      </button>
      <button type="button" id="btn-rotate" aria-pressed="false" title="Slowly spin the instrument">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.9 4M4 12a8 8 0 0 1 14.9-4M19 4v4h-4M5 20v-4h4" /></svg><span>Spin</span>
      </button>
    </div>
    <p class="hint" id="hint">Drag to rotate · Scroll to zoom · Right-drag to pan · Click any part</p>
    <div class="scrim" id="scrim" hidden></div>
    <div class="loading" id="loading"><span class="spinner"></span>Opening the gates…</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
