<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Instrument Zoo</title>
  <meta name="description" content="A museum of the orchestra and wind ensemble in 3D: turn each instrument, draw nearer, and learn the anatomy of every part." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f7f3ea'/><text x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='22' fill='%23a6823a'>𝄞</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app" id="app" data-section="strings">
    <header class="masthead">
      <a class="brand" href="#/">
        <span class="brand-clef" aria-hidden="true">𝄞</span>
        <span class="brand-text">
          <span class="brand-name">Instrument Zoo</span>
          <span class="brand-sub">A Museum of Musical Instruments</span>
        </span>
      </a>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Ensemble">
        <span class="tab-ink" id="tab-ink" aria-hidden="true"></span>
      </nav>
      <button type="button" class="catalogue-btn" id="catalogue-btn" aria-expanded="false" aria-controls="catalogue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Catalogue</span>
      </button>
    </header>

    <main class="stage" id="stage">
      <div class="spotlight" aria-hidden="true"></div>
      <div class="viewer" id="viewer"></div>
      <div class="pin-label" id="pin-label" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>

      <button type="button" class="peek prev" id="peek-prev" aria-label="Previous instrument">
        <span class="peek-frame"><img alt="" /></span>
        <span class="peek-label"><span class="peek-name"></span></span>
      </button>
      <button type="button" class="peek next" id="peek-next" aria-label="Next instrument">
        <span class="peek-frame"><img alt="" /></span>
        <span class="peek-label"><span class="peek-name"></span></span>
      </button>

      <div class="plaque" id="plaque">
        <p class="plaque-section" id="plaque-section"></p>
        <h2 class="plaque-name" id="plaque-name"></h2>
      </div>

      <div class="toolbar" role="toolbar" aria-label="View controls">
        <button type="button" id="btn-reset" title="Return to the whole instrument (Esc)">Overview</button>
        <span class="sep" aria-hidden="true">·</span>
        <button type="button" id="btn-isolate" aria-pressed="false" disabled title="Fade everything except the selected part (I)">Isolate</button>
        <span class="sep" aria-hidden="true">·</span>
        <button type="button" id="btn-rotate" aria-pressed="false" title="Slowly turn the instrument">Turn</button>
      </div>
      <p class="hint" id="hint">Drag to turn · scroll to draw nearer · select any part</p>
    </main>

    <aside class="notes" id="notes" aria-label="Programme notes">
      <div class="notes-scroll" id="notes-scroll">
        <div class="notes-inner" id="notes-inner">
          <p class="eyebrow"><span id="inst-section"></span></p>
          <h1 id="inst-name"></h1>
          <p class="ensembles" id="inst-ensembles"></p>
          <div class="rule" aria-hidden="true"><span>❦</span></div>
          <dl class="facts">
            <div><dt>Range</dt><dd id="inst-range"></dd></div>
            <div><dt>Size</dt><dd id="inst-size"></dd></div>
          </dl>
          <p class="blurb" id="inst-blurb"></p>
          <h3 class="anatomy-title">Anatomy <span id="part-count"></span></h3>
          <ol class="parts" id="parts"></ol>
        </div>
      </div>
    </aside>

    <div class="catalogue" id="catalogue" hidden>
      <div class="catalogue-inner">
        <header class="catalogue-head">
          <h2>The Catalogue</h2>
          <button type="button" class="catalogue-close" id="catalogue-close" aria-label="Close catalogue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div class="catalogue-grid" id="catalogue-grid"></div>
      </div>
    </div>

    <div class="loading" id="loading"><span class="loading-clef">𝄞</span><span>Raising the curtain…</span></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
